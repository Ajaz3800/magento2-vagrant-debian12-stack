server {
    listen 80;
    server_name _;

    root /var/www/html/phpmyadmin/current;
    index index.php index.html;

    # =========================
    # Security hardening
    # =========================

    # Block hidden files (.htaccess, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Restrict access (CHANGE to your IP)
    #allow 127.0.0.1;
    #allow YOUR_PUBLIC_IP;
    #deny all;

    # Limit upload size
    client_max_body_size 32M;

    # =========================
    # Main phpMyAdmin location
    # =========================

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================
    # PHP processing
    # =========================

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # change if needed
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Performance tuning
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # =========================
    # Static files caching
    # =========================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        access_log off;
        log_not_found off;
    }

    # =========================
    # Logs
    # =========================

    access_log /var/log/nginx/phpmyadmin.access.log;
    error_log /var/log/nginx/phpmyadmin.error.log;
}
